<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>wb2api 注册</title>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --brand:#07c160; --brand-dark:#06ad56; --ink:#1a1a1a; --muted:#8a8f99;
    --line:#e8eaed; --bg:#f5f6f8;
  }
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:20px;
  }
  .card{
    width:100%; max-width:400px; background:#fff; border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,.08); padding:32px 24px 24px;
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .logo .mark{
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#07c160,#04a04d);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .logo .mark svg{width:22px;height:22px;fill:#fff}
  .logo .name{font-size:20px;font-weight:600;letter-spacing:.2px}
  h1{font-size:19px;font-weight:600;text-align:center;margin:14px 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;
    height:48px;padding:0 12px;background:#fff;transition:border-color .15s,box-shadow .15s}
  .field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(7,193,96,.12)}
  .field .prefix{color:var(--ink);font-size:15px;padding-right:10px;border-right:1px solid var(--line);
    margin-right:10px;flex:0 0 auto}
  .field input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:transparent;
    font-family:inherit;letter-spacing:.5px;height:100%}
  .field input::placeholder{color:#c2c6cc;letter-spacing:0}
  .field .code{cursor:pointer;color:var(--brand);font-size:13px;font-weight:500;
    padding-left:10px;border-left:1px solid var(--line);margin-left:10px;flex:0 0 auto;
    background:none;border-top:0;border-right:0;border-bottom:0;font-family:inherit}
  .field .code:disabled{color:#c2c6cc;cursor:not-allowed}
  .row{margin-bottom:16px}

  .btn{width:100%;height:48px;border:0;border-radius:10px;background:var(--brand);color:#fff;
    font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s}
  .btn:hover:not(:disabled){background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}

  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  .alt{text-align:center;margin-top:10px}
  .alt a{color:var(--muted);font-size:12px;text-decoration:underline;
    text-underline-offset:2px;cursor:pointer}
  .alt a:hover{color:var(--brand)}
  .hidden{display:none !important}

  .steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px}
  .steps i{width:26px;height:3px;border-radius:2px;background:var(--line);display:block}
  .steps i.on{background:var(--brand)}

  .result{text-align:center;padding:8px 0 4px}
  .result .icon{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .result .icon.ok{background:#e8f8ee}
  .result .icon.err{background:#fdecec}
  .result .icon svg{width:30px;height:30px}
  .result .title{font-size:16px;font-weight:600;margin-bottom:6px}
  .result .desc{font-size:13px;color:var(--muted);line-height:1.7;word-break:break-word}
  .result .desc b{color:var(--ink);font-weight:500}

  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
    border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:6px;
    animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .toast-wrap{position:fixed;left:0;right:0;top:16px;z-index:99;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;padding:0 16px}
  .toast{
    max-width:360px;background:rgba(28,30,34,.94);color:#fff;
    font-size:13.5px;line-height:1.5;padding:10px 14px;border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.22);
    display:flex;align-items:flex-start;gap:8px;
    animation:tin .22s ease-out;word-break:break-word
  }
  .toast.out{animation:tout .22s ease-in forwards}
  .toast svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-8px)}}

  .ferr{color:#e54545;font-size:12px;margin-top:6px;display:none}
  .ferr.show{display:block}
  .field.bad{border-color:#e54545}
  .field.bad:focus-within{box-shadow:0 0 0 3px rgba(229,69,69,.12)}

  .vbox{display:flex;gap:12px;align-items:flex-start;background:#f7f9fb;
    border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .vbox .vico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;
    background:#e8f8ee;display:flex;align-items:center;justify-content:center}
  .vbox .vico svg{width:18px;height:18px}
  .vtitle{font-size:14px;font-weight:600;margin-bottom:3px}
  .vdesc{font-size:12.5px;color:var(--muted);line-height:1.6}
  .waiting{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:14px;color:var(--muted);font-size:13px}
  .spin.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--brand)}

  .foot{text-align:center;color:#b8bcc4;font-size:11px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="toast-wrap" id="toasts"></div>
<div class="card">
  <div class="logo">
    <span class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3 6.5 3.6-2.06 1.15L12 6.6 7.56 9.05 5.5 7.9 12 4.3zM5 9.6l2 1.12v4.56l-2-1.11V9.6zm4 2.24 3 1.67 3-1.67v3.12l-3 1.67-3-1.67v-3.12zm8-2.24v4.57l-2 1.11V10.7l2-1.1z"/></svg>
    </span>
    <span class="name">wb2api</span>
  </div>

  <div id="step1">
    <h1>手机号注册</h1>
    <div class="sub">输入手机号，获取短信验证码即可完成注册</div>

    <div class="steps"><i class="on"></i><i></i></div>

    <div class="row">
      <label for="mobile">手机号</label>
      <div class="field" id="mobileField">
        <select id="country" aria-label="地区">
          <option value="86">+86 中国大陆</option><option value="852">+852 中国香港</option><option value="853">+853 中国澳门</option>
        </select>
        <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel"
               maxlength="11" placeholder="请输入 11 位手机号" />
      </div>
      <div class="ferr" id="mobileErr"></div>
    </div>

    <button id="sendBtn" class="btn">获取验证码</button>
    <div class="note">验证码由运营商下发至你的手机，仅用于本次登录验证。</div>
    <div class="alt"><a href="javascript:void(0)" id="officialLink">使用官方手机号验证登录</a></div>
  </div>

  <div id="step2" class="hidden">
    <h1>输入验证码</h1>
    <div class="sub" id="sentTo">验证码已发送</div>

    <div class="steps"><i class="on"></i><i class="on"></i></div>

    <div class="row">
      <label for="code">短信验证码</label>
      <div class="field" id="codeField">
        <input id="code" type="tel" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="6 位验证码" style="letter-spacing:6px" />
        <button id="resendBtn" class="code" disabled>重新获取</button>
      </div>
      <div class="ferr" id="codeErr"></div>
    </div>

    <button id="verifyBtn" class="btn">注册</button>
    <div class="note">验证码仅用于本次登录验证，不会用于其他用途。</div>
  </div>

  <div id="step3" class="hidden">
    <div class="result">
      <div class="icon ok" id="resIcon"></div>
      <div class="title" id="resTitle"></div>
      <div class="desc" id="resDesc"></div>
    </div>
    <div class="note" id="resHint" style="text-align:center"></div>
    <button id="againBtn" class="btn ghost hidden" style="margin-top:18px">返回</button>
  </div>

  <div id="stepOfficial" class="hidden">
    <h1>请完成手机号验证</h1>
    <div class="sub">在打开的页面里用手机号登录，完成后这里会自动显示结果</div>
    <div class="steps"><i class="on"></i><i class="on"></i></div>

    <div class="vbox">
      <span class="vico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#07c160" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
      </span>
      <div>
        <div class="vtitle">验证页面已打开</div>
        <div class="vdesc">请在那个页面完成手机号登录。<b>完成后本页会自动显示「注册成功」</b>，无需手动操作。</div>
      </div>
    </div>

    <button id="officialOpenBtn" class="btn">重新打开验证页面</button>
    <div class="waiting"><span class="spin dark"></span><span id="officialTip">等待完成验证…</span></div>
    <div class="ferr" id="officialErr"></div>
    <div class="alt"><a href="javascript:void(0)" id="officialBack">返回上一步</a></div>
  </div>

  <div class="foot">请勿在非官方地址输入验证码</div>
</div>

<link rel="stylesheet" href="/static/phone-region.css" />
<script src="/static/phone-session.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var sid = "", timer = null, left = 0, busy = false;
  WBPhone.mountRegion($('country'), $('mobile'));
  var retryUntil = 0;
  function savePhone() {
    WBPhone.save('wb_join_phone', {sid:sid, mobile:$('mobile').value, country:$('country').value,
      retryUntil:retryUntil});
  }
  async function restorePhone() {
    var saved = WBPhone.read('wb_join_phone');
    $('mobile').value = saved.mobile || '';
    $('country').value = ['86','852','853'].indexOf(saved.country) >= 0 ? saved.country : '86';
    WBPhone.syncRegion($('country'));
    $('mobile').maxLength = $('country').value === '86' ? 11 : 8;
    sid = saved.sid || '';
    busy = !!sid;
    countdown(Math.max(0, Math.ceil(((saved.retryUntil || 0)-Date.now())/1000)));
    if (!saved.sid) return;
    try {
      var response = await fetch('/api/join/status/' + encodeURIComponent(saved.sid), {cache:'no-store'});
      if (!response.ok) throw new Error('无法恢复登录会话');
      var state = await response.json();
      if (!state.alive || state.consumed) { sid = ''; WBPhone.clear('wb_join_phone'); return; }
      sid = saved.sid;
      if (state.code_sent) {
        $('mobile').value = state.mobile; $('country').value = state.country_code;
        WBPhone.syncRegion($('country'));
        $('sentTo').textContent = '验证码已发送至 +' + state.country_code + ' ' + state.mobile;
        show('step2');
        countdown(Math.max(state.retry_after || 0, Math.ceil((retryUntil-Date.now())/1000)));
      }
    } catch (e) { toast(e.message); }
    finally {
      busy = false;
      $('sendBtn').disabled = Date.now() < retryUntil;
      $('resendBtn').disabled = Date.now() < retryUntil;
    }
  }

  function show(id) {
    ["step1", "step2", "step3", "stepOfficial"].forEach(function (k) {
      $(k).classList.toggle("hidden", k !== id);
    });
  }

  function api(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = {};
        try { d = t ? JSON.parse(t) : {}; } catch (e) { d = { detail: t }; }
        return { ok: r.ok, status: r.status, data: d, retryAfter:Number(r.headers.get('Retry-After')) || 0 };
      });
    });
  }

  function msgOf(data) {
    var d = data && data.detail;
    if (!d) return "操作失败，请稍后重试";
    if (typeof d === "string") return d;
    return d.message || "操作失败，请稍后重试";
  }

  var TOAST_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" stroke-width="2.2" ' +
    'stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/>' +
    '<circle cx="12" cy="16.5" r="1" fill="#ff8a8a" stroke="none"/></svg>';

  function toast(msg, ms) {
    var wrap = $("toasts");
    if (!wrap) return;
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = TOAST_ICON + "<span></span>";
    el.lastChild.textContent = String(msg == null ? "" : msg);
    wrap.appendChild(el);

    while (wrap.children.length > 3) wrap.removeChild(wrap.firstChild);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, ms || 2600);
  }

  function fieldErr(which, msg) {
    var box = $(which + "Field"), tip = $(which + "Err");
    if (!box || !tip) { toast(msg); return; }
    box.classList.add("bad");
    tip.textContent = msg;
    tip.classList.add("show");
    var inp = $(which);
    if (inp) inp.focus();
  }
  function clearFieldErr(which) {
    var box = $(which + "Field"), tip = $(which + "Err");
    if (box) box.classList.remove("bad");
    if (tip) { tip.textContent = ""; tip.classList.remove("show"); }
  }
  function clearAllFieldErr() { clearFieldErr("mobile"); clearFieldErr("code"); }

  var offTimer = null, offSid = "", offDeadline = 0, offUrl = "", offWin = null;

  function officialStop() {
    if (offTimer) { clearInterval(offTimer); offTimer = null; }
  }

  function officialBeginPoll() {
    if (offTimer || !offSid) return;
    offDeadline = Date.now() + 6 * 60 * 1000;
    offTimer = setInterval(officialPoll, 2500);
    officialPoll();
  }

  function officialOpen(preOpened) {
    if (!offUrl) return false;
    offWin = preOpened || null;
    if (!offWin) {
      offWin = window.open("about:blank", "_blank");
    }
    var tip = $("officialTip");
    if (offWin) {
      try { offWin.location.href = offUrl; } catch (e) { offWin.location = offUrl; }
      try { offWin.focus(); } catch (e) {}
      if (tip) tip.textContent = "等待完成验证…";
      officialBeginPoll();
      return true;
    }
    if (tip) tip.textContent = "新窗口被浏览器拦截了，请点下方按钮打开";
    var el = $("officialErr");
    if (el) {
      el.textContent = "浏览器拦截了新窗口，请点「打开验证页面」继续。";
      el.classList.add("show");
    }
    return false;
  }

  function officialStart() {
    officialStop();
    offUrl = ""; offSid = ""; offWin = null;
    show("stepOfficial");
    $("officialTip").textContent = "正在准备验证…";
    if ($("officialErr")) {
      $("officialErr").textContent = "";
      $("officialErr").classList.remove("show");
    }

    var placeholder = null;
    try { placeholder = window.open("about:blank", "_blank"); } catch (e) { placeholder = null; }

    api("/api/join/official/start", {}).then(function (r) {
      if (!r.ok) throw { data: r.data };
      offSid = r.data.sid;
      offUrl = r.data.auth_url;
      officialOpen(placeholder);
    }).catch(function (e) {
      try { if (placeholder) placeholder.close(); } catch (err) {}
      var el = $("officialErr");
      if (el) { el.textContent = msgOf(e && e.data); el.classList.add("show"); }
      $("officialTip").textContent = "验证准备失败";
    });
  }

  function officialPoll() {
    if (!offSid) return;
    if (Date.now() > offDeadline) {
      officialStop();
      var el = $("officialErr");
      if (el) {
        el.textContent = "验证超时。如果已经登录成功，请点「重新打开验证页面」再走一次，"
                       + "或刷新本页查看结果。";
        el.classList.add("show");
      }
      $("officialTip").textContent = "验证超时";
      return;
    }
    api("/api/join/official/poll", { sid: offSid }).then(function (r) {
      if (!r.ok) throw { data: r.data };
      if (r.data && r.data.done) {
        officialStop();

        handOffToPopup(r.data);
        ok(r.data);
      }
    }).catch(function (e) {
      officialStop();
      var el = $("officialErr");
      if (el) { el.textContent = msgOf(e && e.data); el.classList.add("show"); }
      $("officialTip").textContent = "验证失败";
    });
  }

  function handOffToPopup(data) {
    var masked = (data && data.masked) || "";
    try {
      localStorage.setItem("wb_join_done", JSON.stringify({
        t: Date.now(), masked: masked, invitation: data.invitation
      }));
    } catch (e) {  }
    if (!offWin || offWin.closed) return;
    try {
      offWin.location.replace("/join?done=1&m=" + encodeURIComponent(masked) +
        "&invitation=" + encodeURIComponent(data.invitation && data.invitation.status !== 'disabled' ? data.invitation.message : ''));
    } catch (e) {

    }
  }

  function showDoneFromUrl() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return false; }
    if (q.get("done") !== "1") return false;
    var masked = q.get("m") || "";
    setTimeout(function () {
      $("resIcon").className = "icon ok";
      $("resIcon").innerHTML = OK_ICON;
      $("resTitle").textContent = "注册成功";
      $("resDesc").innerHTML = masked
        ? "欢迎，" + "<b>" + esc(masked) + "</b>"
        : "欢迎使用";
      if (q.get('invitation')) {
        $("resDesc").appendChild(document.createElement('br'));
        $("resDesc").appendChild(document.createTextNode(q.get('invitation')));
      }
      $("resHint").textContent = "可以关闭本页面了。";
      $("againBtn").classList.add("hidden");
      show("step3");
    }, 60);
    return true;
  }

  function restoreDone() {
    var raw;
    try { raw = localStorage.getItem("wb_join_done"); } catch (e) { return false; }
    if (!raw) return false;
    var d;
    try { d = JSON.parse(raw); } catch (e) { return false; }
    if (!d || !d.t || (Date.now() - d.t) > 10 * 60 * 1000) {
      try { localStorage.removeItem("wb_join_done"); } catch (e) {}
      return false;
    }
    setTimeout(function () {
      $("resIcon").className = "icon ok";
      $("resIcon").innerHTML = OK_ICON;
      $("resTitle").textContent = "注册成功";
      $("resDesc").innerHTML = d.masked
        ? "欢迎，" + "<b>" + esc(d.masked) + "</b>"
        : "欢迎使用";
      if (d.invitation && d.invitation.status !== 'disabled') {
        $("resDesc").appendChild(document.createElement('br'));
        $("resDesc").appendChild(document.createTextNode(d.invitation.message));
      }
      $("resHint").textContent = "";
      $("againBtn").classList.remove("hidden");
      show("step3");
    }, 60);
    return true;
  }

  function countdown(sec) {
    retryUntil = Date.now() + Math.max(0, sec) * 1000;
    var btn = $("resendBtn");
    if (timer) clearInterval(timer);
    var tick = function () {
      var b = $("resendBtn");
      left = Math.max(0, Math.ceil((retryUntil-Date.now())/1000));
      if (!b) { clearInterval(timer); return; }
      if (left <= 0) {
        clearInterval(timer); timer = null;
        b.disabled = busy; b.textContent = "重新获取";
        $('sendBtn').disabled = busy; $('sendBtn').textContent = '获取验证码';
        return;
      }
      b.disabled = true;
      b.textContent = left + "s";
      $('sendBtn').disabled = true; $('sendBtn').textContent = left + 's';
    };
    tick();
    if (left > 0) timer = setInterval(tick, 1000);
    savePhone();
  }

  function send() {
    if (busy || Date.now() < retryUntil) return;
    clearAllFieldErr();
    var mobile = ($("mobile").value || "").replace(/\D/g, "");
    var country = $('country').value;
    if (!WBPhone.valid(country, mobile)) {
      fieldErr("mobile", "请输入所选地区的有效手机号");
      return;
    }

    busy = true;
    var btn = $("sendBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>发送中…';

    var ensure = sid ? Promise.resolve({ ok: true }) : api("/api/join/start", {});
    ensure.then(function (s) {
      if (!s.ok) throw { data: s.data };
      if (s.data && s.data.sid) sid = s.data.sid;
      savePhone();
      return api("/api/join/send", { sid: sid, mobile: mobile, country_code:country });
    }).then(function (r) {
      if (!r.ok) {
        countdown(r.retryAfter || 60);

        if (r.data && r.data.detail && r.data.detail.step === "session") sid = "";
        throw { data: r.data };
      }
      show("step2");
      $("sentTo").textContent = "验证码已发送至 +" + country + ' ' + mobile;
      countdown(r.data.retry_after || 60);
      setTimeout(function () { $("code").focus(); }, 80);
    }).catch(function (e) {
      var d = e && e.data;
      var step = d && d.detail && d.detail.step;
      var reason = d && d.detail && d.detail.reason;
      var msg = msgOf(d);

      if (reason === "need_captcha") {
        officialStart();
        return;
      }

      if (step === "mobile" || step === "sms_send") {
        show("step1");
        fieldErr("mobile", msg);
      } else {
        toast(msg);
      }
    }).then(function () {
      busy = false;
      btn.disabled = Date.now() < retryUntil;
      if (!btn.disabled) btn.textContent = "获取验证码";
    });
  }

  function verify() {
    if (busy) return;
    clearFieldErr("code");
    var code = ($("code").value || "").replace(/\D/g, "");
    if (code.length !== 6) {
      fieldErr("code", "请输入 6 位验证码");
      return;
    }
    if (!sid) {
      toast("会话已失效，请重新获取验证码");
      show("step1");
      return;
    }

    busy = true;
    var btn = $("verifyBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>注册中…';

    api("/api/join/verify", { sid: sid, sms_code: code })
      .then(function (r) {
        if (r.ok) { ok(r.data); } else { fieldErr('code', msgOf(r.data)); }
      })
      .catch(function () {
        fieldErr('code', "网络异常，请检查网络后重试");
      })
      .then(function () {
        busy = false;
        btn.disabled = false;
        btn.textContent = "注册";
      });
  }

  var OK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#07c160" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var ERR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#e54545" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function ok(data) {
    WBPhone.clear('wb_join_phone'); sid = '';
    $("resIcon").className = "icon ok";
    $("resIcon").innerHTML = OK_ICON;

    $("resTitle").textContent = "注册成功";
    $("resDesc").innerHTML = data.masked
      ? "欢迎，" + "<b>" + esc(data.masked) + "</b>"
      : "欢迎使用";
    if (data.invitation && data.invitation.status !== 'disabled') {
      $("resDesc").appendChild(document.createElement('br'));
      $("resDesc").appendChild(document.createTextNode(data.invitation.message));
    }

    if (offWin && !offWin.closed) {
      $("resHint").textContent = "验证页面可以关闭了。";
    } else {
      $("resHint").textContent = "";
    }
    $("againBtn").classList.remove("hidden");
    if (timer) { clearInterval(timer); timer = null; }
    show("step3");
  }

  function fail(msg) {
    $("resIcon").className = "icon err";
    $("resIcon").innerHTML = ERR_ICON;
    $("resTitle").textContent = "注册失败";
    $("resDesc").textContent = msg;
    $("againBtn").classList.remove("hidden");
    show("step3");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function reset() {
    WBPhone.clear('wb_join_phone');
    officialStop();
    sid = ""; offSid = ""; offUrl = "";
    offWin = null;
    try { localStorage.removeItem("wb_join_done"); } catch (e) {}
    $("mobile").value = ""; $("code").value = "";
    clearAllFieldErr();
    if (timer) { clearInterval(timer); timer = null; }
    $("resIcon").innerHTML = ""; $("resTitle").textContent = ""; $("resDesc").textContent = "";
    if ($("resHint")) $("resHint").textContent = "";
    $("againBtn").classList.add("hidden");
    show("step1");
  }

  $("sendBtn").addEventListener("click", send);
  $('country').addEventListener('change', function () {
    $('mobile').maxLength = this.value === '86' ? 11 : 8;
    clearFieldErr('mobile'); savePhone();
  });
  $("resendBtn").addEventListener("click", send);
  $("verifyBtn").addEventListener("click", verify);
  $("againBtn").addEventListener("click", reset);
  $("officialLink").addEventListener("click", officialStart);
  $("officialOpenBtn").addEventListener("click", function () { officialOpen(null); });
  $("officialBack").addEventListener("click", function () { officialStop(); show("step1"); });

  $("mobile").addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") verify(); });

  ["mobile", "code"].forEach(function (id) {
    $(id).addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "");
      clearFieldErr(id);
      if (id === 'mobile') savePhone();
    });
  });

  if (!showDoneFromUrl()) {
    if (!restoreDone()) restorePhone();
  }
})();
</script>
</body>
</html>
